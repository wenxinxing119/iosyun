<script>
const params = new URLSearchParams(window.location.search);
let currentCat = params.get('cat') || 'all';
let currentSearch = params.get('search') || '';
let currentSort = 'default';
let currentFilter = params.get('filter') || 'all';
let currentPage = 1;
const pageSize = 12;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('categoriesList').innerHTML = categories.map(c =>
    `<a href="?cat=${c.key}" class="cat-chip${currentCat === c.key ? ' active' : ''}"><span class="emoji">${c.emoji}</span>${c.name}</a>`
  ).join('');

  document.getElementById('filterSelect').value = currentFilter;
  if (currentSearch) document.getElementById('navSearch').value = currentSearch;
  updatePageTitle();
  applyFilters();
});

function updatePageTitle() {
  const title = document.getElementById('pageTitle');
  const sub = document.getElementById('pageSubtitle');
  if (currentCat !== 'all') {
    const cat = categories.find(c => c.key === currentCat);
    if (cat) { title.textContent = cat.emoji + ' ' + cat.name + '应用'; sub.textContent = '浏览我们精选的' + cat.name + '类应用'; }
  }
  if (currentSearch) { title.textContent = '🔍 搜索：' + currentSearch; sub.textContent = '以下是关于"' + currentSearch + '"的应用'; }
  if (currentFilter === 'free') { title.textContent = '🎉 限免 & 免费应用'; sub.textContent = '薅羊毛就要快！手慢无的限免应用都在这里'; }
  else if (currentFilter === 'discount') { title.textContent = '📉 降价应用'; sub.textContent = '发现正在打折的好应用'; }
}

function applyFilters() {
  currentSort = document.getElementById('sortSelect').value;
  currentFilter = document.getElementById('filterSelect').value;

  let filtered = [...loadApps()];

  if (currentCat !== 'all') filtered = filtered.filter(a => a.category === currentCat);

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(a =>
      a.name.toLowerCase().includes(q) || a.category.toLowerCase().includes(q) ||
      a.tags.some(t => t.toLowerCase().includes(q)) || a.description.toLowerCase().includes(q)
    );
  }

  if (currentFilter === 'free') filtered = filtered.filter(a => a.isFree || a.price === '免费');
  else if (currentFilter === 'paid') filtered = filtered.filter(a => !a.isFree && a.price !== '免费');
  else if (currentFilter === 'discount') filtered = filtered.filter(a => a.originalPrice);

  if (currentSort === 'rating') filtered.sort((a, b) => b.rating - a.rating);
  else if (currentSort === 'newest') filtered.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  else if (currentSort === 'price-asc') {
    filtered.sort((a, b) => {
      const pa = a.isFree ? 0 : parseFloat(a.price.replace(/[^0-9.]/g,'')) || 999;
      const pb = b.isFree ? 0 : parseFloat(b.price.replace(/[^0-9.]/g,'')) || 999;
      return pa - pb;
    });
  } else if (currentSort === 'price-desc') {
    filtered.sort((a, b) => {
      const pa = a.isFree ? 0 : parseFloat(a.price.replace(/[^0-9.]/g,'')) || 999;
      const pb = b.isFree ? 0 : parseFloat(b.price.replace(/[^0-9.]/g,'')) || 999;
      return pb - pa;
    });
  }

  const totalPages = Math.ceil(filtered.length / pageSize);
  const start = (currentPage - 1) * pageSize;
  const paged = filtered.slice(start, start + pageSize);

  document.getElementById('appGrid').innerHTML = paged.map(createAppCard).join('');
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';

  const pagEl = document.getElementById('pagination');
  if (totalPages <= 1) { pagEl.innerHTML = ''; return; }
  let html = '';
  if (currentPage > 1) html += '<button onclick="goPage(' + (currentPage-1) + ')">←</button>';
  for (let i = 1; i <= totalPages; i++) {
    html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
  }
  if (currentPage < totalPages) html += '<button onclick="goPage(' + (currentPage+1) + ')">→</button>';
  pagEl.innerHTML = html;
}

function goPage(page) { currentPage = page; applyFilters(); window.scrollTo({ top: 400, behavior: 'smooth' }); }
</script>

name: 每日自动更新

on:
  schedule:
    # 每天北京时间 10:00 (UTC 2:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 🔍 发现新应用
        run: node scripts/fetch-new-apps.mjs

      - name: 🔄 限免轮换
        run: node scripts/update-daily.js

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "🤖 每日自动更新（新应用+限免轮换）[skip ci]"
            git push
          fi
